name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Unit tests
        run: node --test tests/core.test.js
      - name: Package
        id: pkg
        run: echo "path=$(scripts/package.sh)" >> "$GITHUB_OUTPUT"
      - name: AppInspect (cloud)
        run: |
          pip install splunk-appinspect
          for tag in cloud private_victoria; do
            splunk-appinspect inspect "${{ steps.pkg.outputs.path }}" --mode precert \
              --included-tags "$tag" --output-file "ai-$tag.json" --data-format json
            python3 -c "import json,sys; s=json.load(open('ai-$tag.json'))['summary']; print('$tag', s); sys.exit(1 if s['failure'] or s['error'] or s.get('future_failure',0) else 0)"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: dist/*.tgz
